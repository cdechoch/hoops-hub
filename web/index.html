<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hoops Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9cfd7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoops Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="./"><img src="icon.svg" alt=""><span class="wordmark">Hoops Hub</span></a>
    <span id="stamp" class="stamp" aria-live="polite">Loading</span>
    <button id="bell" class="btn" type="button" aria-label="Turn on alerts">Alerts off</button>
  </div>
</header>
<div id="ticker" class="ticker" hidden aria-label="Today's scores"></div>
<div class="wrap">
  <nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="view" class="panel" tabindex="-1" role="tabpanel"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
